{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "job-0e12cd89",
    "namespace": "bless-extension-gateway",
    "labels": {
      "app": "cfg-probe"
    }
  },
  "spec": {
    "ttlSecondsAfterFinished": 120,
    "backoffLimit": 0,
    "template": {
      "metadata": {
        "labels": {
          "app": "cfg-probe"
        }
      },
      "spec": {
        "restartPolicy": "Never",
        "containers": [
          {
            "name": "probe",
            "image": "docker.io/nginxinc/nginx-unprivileged:1.29-alpine",
            "command": [
              "sh",
              "-c"
            ],
            "args": [
              "env; echo ---environ---; tr '\\0' '\\n' < /proc/self/environ"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "bless-extension-gateway"
                }
              },
              {
                "secretRef": {
                  "name": "bless-gateway-aux"
                }
              },
              {
                "secretRef": {
                  "name": "bless-auth"
                }
              }
            ]
          }
        ]
      }
    }
  }
}